<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Admin — Chats</title>
  <style>
    body { background:#0f0f10; color:#e7e7e7; font-family:system-ui,-apple-system,Segoe UI,Roboto; margin:0; }
    header { padding:12px 16px; border-bottom:1px solid #222; display:flex; align-items:center; gap:12px; }
    #secret { background:#1c1c1f; color:#fff; border:1px solid #2c2c2f; border-radius:8px; padding:8px 10px; width:320px; }
    #load { padding:8px 12px; border-radius:8px; border:0; background:#4c8bf5; color:#fff; cursor:pointer; }
    main { display:grid; grid-template-columns: 360px 1fr; height: calc(100vh - 57px); }
    aside { border-right:1px solid #222; overflow:auto; }
    ul { list-style:none; padding:0; margin:0; }
    li { padding:10px 12px; border-bottom:1px solid #202022; cursor:pointer; }
    li:hover { background:#17171a; }
    li.active { background:#1c1c1f; }
    .meta { font-size:12px; opacity:.8; }
    #view { overflow:auto; padding:16px; }
    .msg { background:#17171a; border:1px solid #242428; border-radius:10px; padding:10px 12px; margin-bottom:10px; }
    .role { font-weight:700; margin-bottom:4px; font-size:12px; letter-spacing:.02em; opacity:.9; }
    .time { font-size:12px; opacity:.7; }
    .meta2 { font-size:12px; opacity:.8; margin-left:6px; }
  </style>
</head>
<body>
  <header>
    <input id="secret" type="password" placeholder="Enter ADMIN_SECRET" />
    <button id="load">Load Conversations</button>
  </header>
  <main>
    <aside><ul id="list"></ul></aside>
    <section id="view"><em>Select a conversation…</em></section>
  </main>

  <script>
    const $ = s => document.querySelector(s);
    const list = $("#list"), view = $("#view"), secretInput = $("#secret"), loadBtn = $("#load");
    function fmt(dt){ try{ return new Date(dt).toLocaleString(); } catch { return dt; } }

    async function fetchJSON(url) {
      const sec = sessionStorage.getItem("admin_secret") || secretInput.value.trim();
      if (!sec) { alert("Enter secret"); return null; }
      sessionStorage.setItem("admin_secret", sec);
      const r = await fetch(url, { headers: { "x-admin-secret": sec } });
      if (!r.ok) { alert("Forbidden or error"); return null; }
      return r.json();
    }

    async function loadConversations() {
      const data = await fetchJSON("/api/admin/get-conversations");
      if (!data) return;
      list.innerHTML = "";
      (data.conversations || []).forEach(c => {
        const li = document.createElement("li");
        li.innerHTML = `<div>${c.title || "(untitled)"} <span class="meta">· ${c.owner_id || "anon"}</span></div>
                        <div class="meta">${fmt(c.last_updated)}</div>`;
        li.onclick = () => { list.querySelectorAll("li").forEach(n=>n.classList.remove("active")); li.classList.add("active"); loadMessages(c.id); };
        list.appendChild(li);
      });
    }

    async function loadMessages(conversationId) {
      const data = await fetchJSON(`/api/admin/get-messages?conversationId=${encodeURIComponent(conversationId)}`);
      if (!data) return;
      view.innerHTML = "";
      (data.messages || []).forEach(m => {
        const d = document.createElement("div");
        d.className = "msg";
        d.innerHTML = `<div class="role">${m.role.toUpperCase()} <span class="meta2">${fmt(m.created_at)}</span></div>
                       <div class="content"></div>`;
        d.querySelector(".content").textContent = m.content;
        view.appendChild(d);
      });
    }

    loadBtn.onclick = loadConversations;
    // Restore secret if present
    const saved = sessionStorage.getItem("admin_secret"); if (saved) secretInput.value = saved;
  </script>
</body>
</html>
