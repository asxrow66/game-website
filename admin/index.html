<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
<!-- /admin/index.html -->
<link rel="stylesheet" href="/admin/index.css"></head>
<body>
  <!-- Top bar -->
  <header class="topbar">
    <div class="left">
      <h1>Admin</h1>
      <input id="admin-secret" type="password" placeholder="ADMIN_SECRET" />
      <button id="load-btn" class="btn">Load Conversations</button>
      <div class="search-wrap">
        <input id="search-input" type="search" placeholder="Search titles or words…" />
        <button id="search-btn" class="btn">Search</button>
        <button id="search-clear" class="btn subtle" title="Clear search">✕</button>
      </div>
      <button id="purge-btn" class="btn danger" title='Delete conversations older than a period (e.g., "14d 2h")'>
        Purge by Age
      </button>
    </div>
    <div class="right">
      <button id="open-admin-chat" class="btn primary" title="Open Admin Chat">
        + Admin Chat
      </button>
    </div>
  </header>

  <!-- Main layout -->
  <main class="layout">
    <!-- Sidebar: conversations + storage -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <span>Conversations</span>
        <span id="result-count" class="muted small"></span>
      </div>
      <ul id="convo-list"></ul>

      <div class="storage-card">
        <div class="storage-title">Storage</div>
        <div class="gauge-wrap">
          <div class="gauge" id="gauge"></div>
          <div class="gauge-center">
            <div id="gauge-percent">0%</div>
            <div id="gauge-mb" class="muted">0/0 MB</div>
          </div>
        </div>
        <div id="storage-caption" class="muted small"></div>
      </div>
    </aside>

    <!-- Messages panel -->
    <section class="content">
      <div id="messages" class="messages"></div>
      <div id="empty-hint" class="muted center">Select a conversation to view messages.</div>
    </section>
  </main>

  <script>
    // ---------- Helpers ----------
    const $ = (s) => document.querySelector(s);
    const listEl = $("#convo-list");
    const msgsEl = $("#messages");
    const hintEl = $("#empty-hint");
    const secretInput = $("#admin-secret");
    const loadBtn = $("#load-btn");
    const purgeBtn = $("#purge-btn");
    const chatBtn = $("#open-admin-chat");

    const searchInput = $("#search-input");
    const searchBtn = $("#search-btn");
    const searchClear = $("#search-clear");
    const resultCount = $("#result-count");

    const GAUGE = $("#gauge");
    const GAUGE_PCT = $("#gauge-percent");
    const GAUGE_MB = $("#gauge-mb");
    const STORAGE_CAPTION = $("#storage-caption");

    // Persist secret in session
    const SKEY = "admin_secret";
    secretInput.value = sessionStorage.getItem(SKEY) || "";
    secretInput.addEventListener("input", () => {
      sessionStorage.setItem(SKEY, secretInput.value);
    });

    function adminHeaders(extra={}) {
      return { "x-admin-secret": secretInput.value.trim(), ...extra };
    }

    async function api(path, opts={}) {
      const res = await fetch(path, { ...opts, headers: adminHeaders(opts.headers || {}) });
      if (!res.ok) {
        const t = await res.text().catch(()=>res.statusText);
        throw new Error(t || ("HTTP "+res.status));
      }
      const ct = res.headers.get("content-type") || "";
      return ct.includes("application/json") ? res.json() : res.text();
    }

    function humanTime(ts) {
      try { return new Date(ts).toLocaleString(); } catch { return ts; }
    }

    function clearMessages() {
      msgsEl.innerHTML = "";
      hintEl.style.display = "block";
    }

    function addMsg(role, content, ts) {
      hintEl.style.display = "none";
      const row = document.createElement("div");
      row.className = "msg";
      row.innerHTML = `
        <div class="role ${role}">${role}</div>
        <div class="bubble">${content}</div>
        <div class="time">${humanTime(ts)}</div>
      `;
      msgsEl.appendChild(row);
      msgsEl.scrollTop = msgsEl.scrollHeight;
    }

    function renderGauge(percent, usedMB, quotaMB) {
      const pct = Math.max(0, Math.min(100, Math.round(percent)));
      GAUGE.style.background = `conic-gradient(var(--brand) ${pct*3.6}deg, var(--gauge-bg) 0)`;
      GAUGE_PCT.textContent = pct + "%";
      GAUGE_MB.textContent = `${usedMB}/${quotaMB} MB`;
    }

    // ---------- Storage ----------
    async function loadStorage() {
      try {
        const s = await api("/api/admin/storage");
        const used = Number(s.used_mb || 0);
        const quota = Number(s.quota_mb || 0);
        const percentUsed = Number(s.percent_used || 0); // already 0–100 from your API
        renderGauge(percentUsed, used.toFixed(1), quota.toFixed(0));
        STORAGE_CAPTION.textContent = `Used ${used.toFixed(1)} MB of ${quota.toFixed(0)} MB`;
      } catch (e) {
        console.error("storage error:", e);
      }
    }

    // ---------- Render conversations ----------
    function highlight(text, q) {
      if (!q) return text;
      const terms = q.split(/\s+/).filter(Boolean);
      let out = text;
      for (const term of terms) {
        const re = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
        out = out.replace(re, '<mark>$1</mark>');
      }
      return out;
    }

    function renderList(items, q=null) {
      listEl.innerHTML = "";
      if (!items.length) {
        listEl.innerHTML = '<li class="muted small pad">No results.</li>';
        return;
      }
      items.forEach(c => {
        const li = document.createElement("li");
        li.className = "convo";
        li.innerHTML = `
          <div class="convo-main">
            <div class="title" title="${c.title || "(untitled)"}">
              ${highlight(c.title || "(untitled)", q || "")}
              ${c.match ? `<span class="badge">in ${c.match}</span>` : ""}
            </div>
            <div class="meta">${humanTime(c.last_updated)}</div>
          </div>
          <button class="icon danger" title="Delete">🗑</button>
        `;

        const delBtn = li.querySelector(".icon.danger");
        delBtn.addEventListener("click", async (e) => {
          e.stopPropagation();
          if (!confirm("Delete this conversation?")) return;
          try {
            await api("/api/admin/delete-conversation", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ conversationId: c.id })
            });
            clearMessages();
            await doLoad(); // reload list & storage
          } catch (err) {
            alert("Delete failed. See console."); console.error(err);
          }
        });

        li.addEventListener("click", async () => {
          document.querySelectorAll(".convo.active").forEach(n => n.classList.remove("active"));
          li.classList.add("active");
          await loadMessages(c.id);
        });

        listEl.appendChild(li);
      });
    }

    // ---------- Standard load (no search) ----------
    async function loadConversations() {
      const data = await api("/api/admin/get-conversations");
      const items = data.conversations || [];
      resultCount.textContent = items.length ? `${items.length}` : "";
      renderList(items);
      clearMessages();
    }

    async function loadMessages(conversationId) {
      msgsEl.innerHTML = "";
      hintEl.style.display = "block";
      try {
        const data = await api(`/api/admin/get-messages?conversationId=${encodeURIComponent(conversationId)}`);
        (data.messages || []).forEach(m => addMsg(m.role, m.content, m.created_at));
      } catch (e) {
        alert("Failed to load messages. See console."); console.error(e);
      }
    }

    // ---------- Search ----------
    async function doSearch() {
      const q = searchInput.value.trim();
      if (!q) { await loadConversations(); return; }
      const data = await api(`/api/admin/search?q=${encodeURIComponent(q)}`);
      const items = data.results || [];
      resultCount.textContent = items.length ? `${items.length} result${items.length===1?"":"s"}` : "0 results";
      renderList(items, q);
      clearMessages();
    }
    function clearSearch() {
      searchInput.value = "";
      resultCount.textContent = "";
    }

    // ---------- Purge by Age ----------
    function parseDurationToSeconds(input) {
      if (!input) return null;
      const re = /(\d+)\s*([dhms])/gi;
      let sec = 0, match;
      while ((match = re.exec(input))) {
        const n = parseInt(match[1], 10);
        const u = match[2].toLowerCase();
        if (u === "d") sec += n * 86400;
        else if (u === "h") sec += n * 3600;
        else if (u === "m") sec += n * 60;
        else if (u === "s") sec += n;
      }
      return sec || null;
    }
    async function handlePurge() {
      const input = prompt('Delete conversations older than… (e.g. "14d", "7d 12h", "90m")');
      if (!input) return;
      const seconds = parseDurationToSeconds(input);
      if (!seconds) { alert("Could not parse that duration."); return; }
      try {
        await api("/api/admin/cleanup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ olderThan: input }) // backend parses human string
        });
        alert("Cleanup complete.");
        await doLoad();
      } catch (e) {
        alert("Cleanup failed. See console."); console.error(e);
      }
    }

    // ---------- Events ----------
    async function doLoad() {
      await loadConversations();
      await loadStorage();
    }

    loadBtn.addEventListener("click", doLoad);
    purgeBtn.addEventListener("click", handlePurge);
    chatBtn.addEventListener("click", () => location.href = "/admin/chat.html");

    searchBtn.addEventListener("click", doSearch);
    searchClear.addEventListener("click", async () => { clearSearch(); await doLoad(); });
    searchInput.addEventListener("keydown", async (e) => {
      if (e.key === "Enter") { e.preventDefault(); await doSearch(); }
      if (e.key === "Escape") { clearSearch(); await doLoad(); }
    });

    // Initial auto-load if a secret is already present
    if (secretInput.value.trim()) doLoad();
  </script>
</body>
</html>
