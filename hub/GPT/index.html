<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href=".../favicon.ico" />

  <!-- Markdown + Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js/lib/common.min.js"></script>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css"
  />
</head>
<body>
  <header>
    <div class="brand">ChatGPT</div>
    <div class="actions">
      <label class="switch">
        <input type="checkbox" id="use-web" />
        <span class="slider"></span>
        <span class="label">🌐 Use Web</span>
      </label>
      <button id="new-chat-btn" title="New Chat">＋ New Chat</button>
    </div>
  </header>

  <div class="layout">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">Your Chats</div>
      <ul id="conv-list"></ul>
    </aside>

    <!-- Main Chat -->
    <main id="chat" class="chat-window"></main>
  </div>

  <!-- Composer -->
  <form id="composer" autocomplete="off">
    <textarea
      id="prompt"
      placeholder="Send a message..."
      rows="1"
      autofocus
    ></textarea>
    <button type="submit" id="send-btn" title="Send">➤</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
