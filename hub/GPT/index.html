<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google</title>
  <link rel="stylesheet" href="styles.css" />
<link rel="icon" href=".../favicon.ico" type="image/x-icon">

   
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function(){ (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>

  <!-- Markdown + Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <h1>ChatGPT</h1>
      <div class="actions">
        <label class="switch" title="Use internet search for this message">
          <input type="checkbox" id="use-web">
          <span class="slider"></span>
          <span class="label">🌐 Use Web</span>
        </label>
        <button id="new-chat-btn">＋ New Chat</button>
      </div>
    </header>

    <main id="chat"></main>

    <form id="composer">
      <textarea id="prompt" placeholder="Send a message..." rows="1"></textarea>
      <button type="submit" id="send-btn" aria-label="Send message">➤</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
