    group.className = 'note';
    const items = section.items.map(s=>`<li>${s}</li>`).join('');

  // ========= Grid / Search =========
  const grid = document.getElementById('grid');

  function render(list){
    grid.innerHTML = '';
    list.forEach(game => {
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `
        <a class="tile" href="${game.url}" title="${game.name}">
          <span class="tile-text">${game.name}</span>
        </a>
        <div class="meta"><div class="name">${game.name}</div></div>
      `;
      // Alt+Click -> about:blank wrapper
      card.addEventListener('click', (e)=>{
        const link = card.querySelector('a.tile');
        if(e.altKey){
          e.preventDefault();
          openInAboutBlank(new URL(link.getAttribute('href'), location.href).href);
        }
      });
      grid.appendChild(card);
    });
  }

  const search = document.getElementById('search');
  document.getElementById('clear').addEventListener('click', ()=>{ search.value=''; apply(); });
  search.addEventListener('input', apply);

  let CURRENT = [...GAMES];
  function apply(){
    const q = (search.value||'').toLowerCase().trim();
    const filtered = !q ? CURRENT : CURRENT.filter(g => g.name.toLowerCase().includes(q));
    render(filtered);
  }

  // ========= about:blank helpers & quick actions =========
  function openInAboutBlank(url){
    const w = window.open('about:blank','_blank');
    if(!w){ alert('Popup blocked. Enable popups and try again.'); return; }
    const html = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>about:blank wrapper</title><style>html,body,iframe{height:100%;width:100%;margin:0;border:0}body{background:#000}</style></head><body><iframe src="${url}" allow="fullscreen *; autoplay; clipboard-read; clipboard-write" referrerpolicy="no-referrer"></iframe></body></html>`;
    w.document.open(); w.document.write(html); w.document.close();
  }
